name: build-fpk

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "fnOS package version (X.Y.Z)"
        required: true
        default: "0.1.1320"
      upstream_tag:
        description: "Upstream yetone/magpie tag"
        required: true
        default: "v0.1.1318"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: vars
        name: Resolve versions
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "${GITHUB_OUTPUT}"
            # Packaging releases may be newer than upstream; this file pins
            # the upstream source tag used by the build.
            echo "upstream=$(cat .github/upstream-tag)" >> "${GITHUB_OUTPUT}"
          else
            echo "version=${{ inputs.version }}" >> "${GITHUB_OUTPUT}"
            echo "upstream=${{ inputs.upstream_tag }}" >> "${GITHUB_OUTPUT}"
          fi

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: false

      - name: Build x86 and ARM FPKs
        env:
          VERSION: ${{ steps.vars.outputs.version }}
          UPSTREAM_TAG: ${{ steps.vars.outputs.upstream }}
        run: |
          chmod +x build-fpk.sh scripts/docker-fnpack.sh
          ./build-fpk.sh

      - name: Generate update feed
        run: |
          version="${{ steps.vars.outputs.version }}"
          cat > dist/update-feed.json <<EOF
          {"version":"${version}","notes":"飞牛 FPK ${version} 已发布。请在飞牛应用中心安装新的 FPK。","url":"https://github.com/SMTM-PH/magpie-fnos/releases/tag/v${version}","assets":{}}
          EOF
          cat dist/update-feed.json

      - uses: actions/upload-artifact@v4
        with:
          name: magpie-fpk
          path: |
            dist/*.fpk
            dist/SHA256SUMS.txt
            dist/update-feed.json
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.fpk
            dist/SHA256SUMS.txt
            dist/update-feed.json
          generate_release_notes: true
